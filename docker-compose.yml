services:
  # FastAPI Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumni_web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_NAME: "${APP_NAME:-Alumni Tracking System}"
      APP_ENV: "${APP_ENV:-development}"
      DEBUG: "${DEBUG:-True}"
      PYTHONUNBUFFERED: "1"
      POSTGRES_SERVER: "db"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${POSTGRES_USER:-alumni_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-alumni_password}"
      POSTGRES_DB: "${POSTGRES_DB:-alumni_db}"
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-alumni_user}:${POSTGRES_PASSWORD:-alumni_password}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-alumni_db}}"
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PostgreSQL Database (Persistent Storage via Named Volume)
  db:
    image: postgres:16-alpine
    container_name: alumni_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-alumni_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-alumni_password}"
      POSTGRES_DB: "${POSTGRES_DB:-alumni_db}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alumni_user} -d ${POSTGRES_DB:-alumni_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
